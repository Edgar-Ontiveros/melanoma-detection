# F6 — exportación del paquete de modelo y verificación de paridad. Mismo modelo y datos que
# f4.yaml / f5.yaml; nada del modelo cambia. Uso: uv run python scripts/export_bundle.py
defaults:
  - data: isic2020
  - model: effnetv2s_384
  - train: matrix
  - _self_

data:
  env: local
  image_size: 224
  batch_size: 32
  num_workers: 4

f6:
  checkpoint: data/models/tf_efficientnetv2_s-224-s0-e153979-04-0.0000.ckpt
  checkpoint_manifest: reports/f3_final_model.json
  calibration_json: reports/f4_calibration.json
  test_results_json: reports/f4_test_results.json
  val_predictions: reports/predictions/f4_val.csv
  bundle_dir: models/bundle            # fuera de git; se publica como release asset
  test_bundle_dir: models/test_bundle  # pesos aleatorios, para CI y Docker
  opset: 17
  intra_op_threads: 4
  seed: 20260904
  n_parity: 200
  n_parity_originals: 100           # originales de data/raw (hasta 6,000 px) de validación
  raw_images_dir: data/raw/isic2020/train
  tolerances:
    logit: 1.0e-4
    platt: 1.0e-6
    cam_corr: 0.999
    full_chain_logit: 1.0e-3
  parity_json: reports/f6_parity.json
  latency_md: reports/f6_latency.md
  bench_requests: 200
  # ---- F6b: paquete con el ensamble E1/none (docs/specs/F6b.md). `mode: ensemble` es el
  # paquete que se despliega; `mode: single` reexporta el de F6 a single_bundle_dir.
  mode: ensemble
  ensemble:
    protocol: docs/f4b_protocol.yaml           # fuente de miembros, Platt, τ95/τ90; se compara valor por valor
    ensemble_json: reports/f3b_ensemble.json  # p5/p95 de los umbrales y n de validación
    test_results_json: reports/f4b_test_results.json
    test_predictions: reports/predictions/f4b_test.csv     # IC de sens/spec/VPP/VPN en τ95
    previous_test_results_json: reports/f4_test_results.json
    previous_test_predictions: reports/predictions/f4_test.csv
    bundle_dir: models/bundle                  # el que sirve la API y se publica (F6b.6)
    single_bundle_dir: models/bundle_single    # el paquete de F6, conservado
    val_logits_npz: reports/predictions/f3b_val_logits.npz
    tolerance_vs_cache: 1.0e-3                 # F6b.2: API por miembro vs caché (vista identity)
    parity_json: reports/f6b_parity.json
    latency_md: reports/f6b_latency.md
    latency_target_ms: 200

hydra:
  run:
    dir: outputs/f6/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
