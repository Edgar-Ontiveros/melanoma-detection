name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar entorno (core + train + dev + api, ruedas CPU)
        run: uv sync --extra train --group dev --group api --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/web/package-lock.json

      - name: "Interfaz: npm ci, lint, pruebas y build"
        working-directory: services/web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: pytest con cobertura
        run: uv run --no-sync pytest --cov --cov-report=term-missing

      - name: Prueba de humo (CPU, datos sintéticos)
        run: uv run --no-sync python scripts/smoke_train.py

      - name: docker build de la API
        run: docker build -f services/api/Dockerfile -t melanoma-api .

      - name: Tamaño de la imagen de la API (máx. 650 MB sin comprimir)
        run: python3 scripts/check_image_size.py melanoma-api 650

      - name: Paquete de prueba (pesos aleatorios, ensamble de 3) para la imagen
        run: uv run --no-sync python scripts/make_test_bundle.py --out models/test_bundle --members 3

      - name: La imagen arranca, verifica el manifiesto y responde /health y /predict
        run: |
          docker run -d --name api -p 8000:8000 -v "$PWD/models/test_bundle:/bundle:ro" melanoma-api
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi; sleep 2
          done
          [ "${ok:-0}" = 1 ] || { docker logs api; exit 1; }
          uv run --no-sync python -c "from PIL import Image; import numpy as np; Image.fromarray(np.full((300,400,3),150,np.uint8)).save('/tmp/x.png')"
          curl -fsS -F "file=@/tmp/x.png" http://127.0.0.1:8000/api/predict | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['disclaimer'] and 0<=b['probability']<=1 and b['cam']['status'] in ('ok','no_positive_evidence'); print('predict OK', b['model_version'])"
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">' && echo 'SPA OK'
          curl -fsS http://127.0.0.1:8000/modelo | grep -q '<div id="root">' && echo 'SPA /modelo OK'
          docker rm -f api

  # F8.1 — Publica la imagen (amd64) en GitHub Container Registry en cada push a main, solo si
  # `checks` pasó (incluido el límite de tamaño). Etiquetas: SHA corto de git y `latest`.
  # El servidor de F8 solo hace `pull` de esta imagen; nunca compila.
  publish:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen (SHA corto y latest)
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/melanoma-detection" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
